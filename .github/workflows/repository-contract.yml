name: Axiom Forge Repository Contract

on:
  push:
    branches:
      - main
      - feat-axiom-forge-ui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-forge-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Python runtime
        run: python3 --version

      - name: Compile Python surfaces
        run: python3 -m compileall -q backend zwa_lite.py tests

      - name: Verify repository authority and execution contract
        run: python3 -m unittest discover -s tests -v
